# Amore local Supabase config — see https://supabase.com/docs/guides/cli/config
project_id = "amore-jewelry"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
# Global invite-only: block public signups while keeping email/password login.
enable_signup = false

[auth.email]
# Must stay true so seeded staff can signInWithPassword (CLI maps this to the
# email provider enabled flag; false disables all email logins).
enable_signup = true
enable_confirmations = false
